<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text-to-SQL Sales Analyzer</title>
  <meta name="description" content="Ask questions about sales data in English or Arabic. AI writes the SQL, and the app runs it read-only.">
  <meta name="theme-color" content="#17233a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317233A'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h14' stroke='%23EEF1F4' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="band">
    <div class="band-inner">
      <div class="masthead">
        <h1 data-i18n="title">Text-to-SQL Sales Analyzer</h1>
        <button type="button" class="lang-switch" id="lang-switch" lang="ar">العربية</button>
      </div>
      <p class="lede" data-i18n="lede"></p>

      <form class="ask" id="ask-form" autocomplete="off">
        <label class="visually-hidden" for="question" data-i18n="questionLabel">Your question</label>
        <input id="question" name="question" type="text" maxlength="300" dir="auto" required>
        <button type="submit" id="ask-button" data-i18n="ask">Ask</button>
      </form>

      <div class="examples">
        <span class="examples-label" data-i18n="examplesLabel">Try one:</span>
        <div class="chips" id="examples"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="result sheet" id="result" aria-live="polite"></section>

    <section class="how" aria-labelledby="how-title">
      <h2 id="how-title" data-i18n="howTitle">How it works</h2>
      <ol class="steps">
        <li>
          <h3 data-i18n="step1Title"></h3>
          <p data-i18n="step1Body"></p>
        </li>
        <li>
          <h3 data-i18n="step2Title"></h3>
          <p data-i18n="step2Body"></p>
        </li>
        <li>
          <h3 data-i18n="step3Title"></h3>
          <p data-i18n="step3Body"></p>
        </li>
      </ol>
    </section>

    <section class="data" id="data" aria-labelledby="data-title">
      <h2 id="data-title" data-i18n="dataTitle">What's in the data</h2>
      <p class="section-intro" data-i18n="dataIntro"></p>
      <dl class="facts" id="facts"></dl>
      <div class="sheet table-wrap">
        <table class="sample" id="sample"></table>
      </div>
      <p class="data-note" data-i18n="dataNote"></p>
      <p class="not-in-data">
        <strong data-i18n="notInDataTitle"></strong>
        <span data-i18n="notInData"></span>
      </p>
    </section>

    <footer class="colophon">
      <p data-i18n-html="footer"></p>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
