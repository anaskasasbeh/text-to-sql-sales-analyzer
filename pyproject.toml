[project]
name = "text-to-sql-sales-analyzer"
version = "1.0.0"
description = "Ask questions about sales data in English or Arabic; an LLM writes the SQL."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]  # an if/else with a comment reads better than a long ternary

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
